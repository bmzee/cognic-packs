schema_version: 1
facility_api_version: 1.0.0
name: gl-reconciler
version: 0.1.1
publisher: anthropic-fsi
license: Apache-2.0
risk_tier: baseline
dependencies: []
agents:
- id: gl-reconciler
  name: gl-reconciler
  description: Reconciles read-only, database-resident banking sources for a trade date, identifies exact breaks between ledger and subledger, traces each break to its evidence, and produces a grounded exception report for sign-off — without ever posting an entry.
  source:
    path: agents/gl-reconciler/agent.md
  model_tier: local
  declared_tools:
  - query_database
  skills: []
  approval_profile: on_request
  delegation_grants: []
- id: gl-reconciler-root
  name: gl-reconciler plugin
  description: The gl-reconciler plugin's entry point — the agent you address first. It selects the imported reconciliation skill that matches your request, finds breaks in read-only database sources, traces their evidence, and reports them for sign-off; it never posts entries.
  source:
    path: agents/gl-reconciler-root/agent.md
  model_tier: local
  declared_tools:
  - query_database
  skills: []
  approval_profile: on_request
  delegation_grants: []
skills:
- id: audit-xls
  source:
    path: agents/gl-reconciler-root/skills/audit-xls/SKILL.md
  license: Apache-2.0
- id: break-trace
  source:
    path: agents/gl-reconciler-root/skills/break-trace/SKILL.md
  license: Apache-2.0
- id: gl-recon
  source:
    path: agents/gl-reconciler-root/skills/gl-recon/SKILL.md
  license: Apache-2.0
- id: xlsx-author
  source:
    path: agents/gl-reconciler-root/skills/xlsx-author/SKILL.md
  license: Apache-2.0
tools:
- name: query_database
  description: Run one read-only SELECT over the synthetic banking demo database
  input_schema:
    type: object
    properties:
      sql:
        type: string
        minLength: 1
    required:
    - sql
    additionalProperties: false
  effect: read_only
  data_classes:
  - syntheticBankingData
  gating: auto
connectors: []
external_mcp_servers: []
egress: []
facilities:
- model_tiers
evals:
  suite:
    path: evals/golden.yaml
  resources:
  - path: import-report.json
  model: cognic-local
  runner: cognic_gateway
  grader: task_outcome
