schema_version: 1
model_route:
  alias: cognic-local
  gateway_config_sha256: "1ef144b8cedb6986ba5c63a9a6e8bc8e53b126e8f0128f6c0fa379f155828a82"
tasks:
  - spec:
      name: database-reconciliation-finds-both-breaks
      agent: gl-reconciler
      prompt: >-
        Reconcile Cedar Example 0003's current account balances against each
        account's latest monthly summary using one read-only query whose SQL
        begins with SELECT, not WITH. State both exact totals and their
        difference, say plainly whether they match, and list every exception
        with account_id, account_balance_cents,
        latest_summary_balance_cents, and difference_cents. Define
        difference_cents as account balance minus latest summary balance. Use
        compared_accounts, mismatch_count, accounts_total_cents,
        summaries_total_cents, and total_difference_cents for aggregate result
        columns. Write cent figures as unformatted integers; never average or
        offset the two exceptions.
      timeout_secs: 180
      samples: 1
      minPasses: 1
      assertions:
        - type: tool_called_with
          name: query_database
          args:
            - path: sql
              matches_regex: '(?i)^\s*select\b'
            - path: sql
              matches_regex: '(?i)\baccounts\b'
            - path: sql
              matches_regex: '(?i)\bcustomers\b'
            - path: sql
              matches_regex: '(?i)\bmonthly_summaries\b'
            - path: sql
              contains: Cedar Example 0003
            - path: sql
              matches_regex: '(?is)\bmax\s*\('
            - path: sql
              matches_regex: '(?is)\border\s+by\b'
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.row_count
          equals: 2
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.compared_accounts
          equals: 2
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.mismatch_count
          equals: 2
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.accounts_total_cents
          equals: 859600
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.summaries_total_cents
          equals: 1237062
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.total_difference_cents
          equals: -377462
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.account_id
          equals: 3
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.account_balance_cents
          equals: 211035
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.latest_summary_balance_cents
          equals: 275543
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.0.difference_cents
          equals: -64508
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.1.account_id
          equals: 4
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.1.account_balance_cents
          equals: 648565
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.1.latest_summary_balance_cents
          equals: 961519
          severity: fail
        - type: tool_result_field
          name: query_database
          path: structuredContent.rows.1.difference_cents
          equals: -312954
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.0.accounts_total_cents
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.0.summaries_total_cents
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.0.total_difference_cents
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.0.account_id
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.0.account_balance_cents
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.0.latest_summary_balance_cents
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.0.difference_cents
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.1.account_id
          severity: fail
        - type: answer_contains_result_field
          tool: query_database
          path: structuredContent.rows.1.account_balance_cents
          severity: fail
        - type: answer_contains_result_field
